name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a dependency advisory published after a merge still surface, since the audit only runs
  # on restore and nothing else would trigger it.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Windows, not Linux. The tests build real paths with backslashes, which is a directory
    # separator here and an ordinary filename character there.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Restore is also where NuGet Audit runs. Directory.Build.props promotes its findings
      # (NU1901-NU1904) to errors, so a package with a known advisory fails the build here.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Analyzers and code style are enforced during build; this catches formatting only.
      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: Html;Badges;MarkdownSummaryGithub

      # The per-class breakdown says more than the single percentage the badge shows, and it is
      # here on every run including pull requests.
      - name: Publish coverage summary
        if: always()
        shell: bash
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

      # Reported separately from the build so the reason is obvious when it is a dependency
      # problem rather than a code one.
      - name: List vulnerable packages
        if: always()
        run: dotnet list package --vulnerable --include-transitive

  # The badge and the HTML report are published to an orphan gh-pages branch rather than committed
  # to main, so the history stays free of "update coverage badge" noise.
  #
  # Split from the build job on purpose: this is the only job that needs write access, and it runs
  # no project code - it just takes the artifact the build produced and publishes it.
  publish-coverage:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: coverage
          single-commit: true
