version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Mutagen, Synthesis and Noggog release in lockstep; separate PRs for them would not build.
      mutagen:
        patterns:
          - "Mutagen.Bethesda*"
          - "Synthesis.Bethesda*"
          - "Noggog.*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
